services:
  postgres:
    image: postgres:16-alpine
    container_name: codeyoung_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: codeyoung_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codeyoung_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
